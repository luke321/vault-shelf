<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Shelf</title>

<style>
/* THE STANDALONE'S OWN CHROME, and the only CSS here that is not page.css.
 *
 * page.css is scoped entirely under `.vault-shelf` so it can be dropped into somebody else's
 * document without styling it. That leaves the document itself unstyled -- and the container
 * asks for `height: 100%`, which against an auto-height body resolves to zero and draws
 * nothing at all. In a plugin the host has already sized the view; here nobody has, so the
 * shell does it.
 *
 * No custom properties are used: they live on `.vault-shelf` now, so they do not exist out
 * here. The container paints the full viewport anyway, so nothing shows through.
 */
html, body { height: 100%; margin: 0; }

</style>
<style>
/* Every rule in this file is scoped under .vault-shelf, and scripts/check-scope.mjs holds
 * it there. This stylesheet ships as the plugin's own, loaded into Obsidian's document:
 * one unscoped selector styles the whole app, and the failure reads as an Obsidian bug.
 * design/0005
 */

/* ---- tokens: light is the base, dark redefines only what changes ----------
 * design/0005 -- THESE ARE VAULT GRAPH'S, copied out of its stylesheet, value for value.
 * Not "inspired by": the same twelve group slots, the same surfaces, the same text ramp. A
 * folder that is #2a78d6 on the disc is #2a78d6 on a spine, or the two views are describing
 * different vaults.
 */
.vault-shelf {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --border:    #dedcd5;
  --border-strong: #c4c2b8;
  --text-1: #0b0b0b;
  --text-2: #52514e;
  --text-3: #86857d;
  --edge:      #e8e7e1;
  --edge-hi:   #2a78d6;
  --dim:       #e6e5df;
  --g1: #2a78d6;
  --g2: #eb6834;
  --g3: #1baf7a;
  --g4: #eda100;
  --g5: #008300;
  --g6: #d3006e;
  --g7: #4a3aa7;
  --g8: #e34948;
  --g9: #00aecb;
  --g10:#9412ad;
  --g11:#6f6e67;
  --g12:#45443f;
  --n1: #6f6e67;
  --n2: #45443f;
  --n3: #8a897f;
  --accent: #2a78d6;
}

@media (prefers-color-scheme: dark) {
  .vault-shelf:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --border:    #33332f;
    --border-strong: #4a4a45;
    --text-1: #ffffff;
    --text-2: #c3c2b7;
    --text-3: #8d8c84;
    --edge:      #333330;
    --edge-hi:   #3987e5;
    --dim:       #2a2a28;
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500;
    --g5: #008300; --g6: #eb1580; --g7: #9085e9; --g8: #e66767;
    --g9: #009fbb; --g10:#b429d1;
    --g11:#8d8c84; --g12:#bdbcb2;
    --n1: #8d8c84; --n2: #bdbcb2; --n3: #77766d;
    --accent: #3987e5;
    --tint: 14%;
  }
}

.vault-shelf[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #232322;
  --border:    #33332f;
  --border-strong: #4a4a45;
  --text-1: #ffffff;
  --text-2: #c3c2b7;
  --text-3: #8d8c84;
  --edge:      #333330;
  --edge-hi:   #3987e5;
  --dim:       #2a2a28;
  --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500;
  --g5: #008300; --g6: #eb1580; --g7: #9085e9; --g8: #e66767;
  --g9: #009fbb; --g10:#b429d1;
  --g11:#8d8c84; --g12:#bdbcb2;
  --n1: #8d8c84; --n2: #bdbcb2; --n3: #77766d;
  --accent: #3987e5;
  --tint: 14%;
}

/* ---- the room ------------------------------------------------------------
 * design/0009 -- no sidebar. The library IS the surface; the only chrome is one rail across
 * the top, and it is the width of a shelf label rather than a panel.
 */
.vault-shelf {
  /* design/0011 -- a book's THICKNESS is its note count. --spine-w is the fallback for a
   * spine nobody has sized (the builder's preview draws before the library has a maximum to
   * scale against); src/page.js sets the real one per book. */
  --spine-w: 34px;
  --spine-h: 132px;
  --board: 3px;
  /* design/0009 -- A ROOM HAS A WIDTH. On a WQHD screen the leaf is ~2,200px after Obsidian's
   * own sidebar, and full-bleed put four books on an 1,800px shelf board and left the note a
   * 380px column of text adrift in a 2,000px page with its index tabs pinned to the far edge.
   * 1,180px is about 28 spines -- a shelf you can take in -- and it is also contents plus a
   * 66ch note plus its tabs, so the reader closes up into something that reads as one book. */
  --measure: 1180px;
  /* design/0005 -- HOW MUCH OF ITS FOLDER'S COLOUR A BOOK'S BOARD TAKES, and it is not the
   * same number in the two themes. Mixing a saturated hue into a DARK surface deepens it and
   * reads as dyed cloth; mixing the same hue into WHITE can only lighten toward it, so the
   * identical 14% that looked like a bound board in dark came out as pale sweet-shop pastel
   * in light. Rendered at 4/9/14/20 in dark and 18/26/34/44 in light and looked at; these two
   * are where the shelves read equally understated. */
  --tint: 20%;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --prose: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;

  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  color: var(--text-1);
  background: var(--surface-0);
  font: 13px/1.5 var(--ui);
  position: relative;
  overflow: hidden;
}

.vault-shelf * { box-sizing: border-box; }

/* HIDDEN MEANS HIDDEN. The reader and both sheets are laid out with `display: flex` on a
 * class, which is specificity 0-2-0 and beats the user agent's `[hidden] { display: none }`
 * at 0-1-0 -- so every one of them painted over the library at all times while the `hidden`
 * ATTRIBUTE said otherwise and every check that read the attribute passed. It took a
 * screenshot to see. `.vault-shelf [hidden]` matches the attribute at 0-2-0 and the
 * !important settles it for anything added later. */
.vault-shelf [hidden] { display: none !important; }

.vault-shelf .vs-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.vault-shelf :focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---- the top rail -------------------------------------------------------- */

.vault-shelf #vs-rail {
  display: flex;
  flex: 0 0 auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
  padding: 8px 16px;
}

/* Chrome stays full-bleed -- a toolbar that stops mid-screen looks broken -- but what is IN
 * it lines up with the library underneath. */
.vault-shelf .vs-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: var(--measure);
  margin: 0 auto;
  min-width: 0;
}

.vault-shelf .vs-railname {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-1);
  white-space: nowrap;
}

.vault-shelf #vs-jump {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1 1 auto;
  min-width: 0;
  scrollbar-width: none;
}

.vault-shelf #vs-jump::-webkit-scrollbar { display: none; }

.vault-shelf .vs-jump {
  flex: 0 0 auto;
  font: inherit;
  font-size: 11.5px;
  color: var(--text-2);
  background: none;
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 3px 8px;
  cursor: pointer;
  white-space: nowrap;
}

.vault-shelf .vs-jump:hover { color: var(--text-1); background: var(--surface-2); border-color: var(--border); }
.vault-shelf .vs-jump .vs-n { color: var(--text-3); margin-left: 5px; font-variant-numeric: tabular-nums; }

.vault-shelf #vs-q {
  flex: 0 0 auto;
  width: 232px;
  font: inherit;
  color: var(--text-1);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 9px;
  min-height: 28px;
}

.vault-shelf #vs-q:focus { border-color: var(--accent); outline: none; }

.vault-shelf #vs-hits {
  flex: 0 0 auto;
  font-size: 11.5px;
  color: var(--text-3);
  min-width: 96px;
  font-variant-numeric: tabular-nums;
}

/* ---- buttons ------------------------------------------------------------- */

.vault-shelf button {
  font: inherit;
  font-size: 11.5px;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 9px;
  cursor: pointer;
  min-height: 26px;
}

.vault-shelf button:hover { color: var(--text-1); border-color: var(--border-strong); }
.vault-shelf button:disabled { opacity: 0.45; cursor: default; }

.vault-shelf button.vs-primary {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

.vault-shelf button.vs-primary:hover { filter: brightness(1.08); color: #fff; }

.vault-shelf .vs-mini { display: flex; gap: 6px; flex-wrap: wrap; }
.vault-shelf .vs-mini.vs-wide { margin-top: 10px; }
.vault-shelf .vs-mini.vs-wide button { flex: 1 1 auto; }

.vault-shelf input[type="search"],
.vault-shelf input[type="text"],
.vault-shelf select {
  font: inherit;
  width: 100%;
  color: var(--text-1);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 5px 8px;
  min-height: 28px;
}

.vault-shelf .vs-lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 7px;
}

.vault-shelf .vs-val { color: var(--text-2); text-transform: none; letter-spacing: 0; }
.vault-shelf .vs-hint { font-size: 11.5px; color: var(--text-3); margin: 6px 0 0; }

.vault-shelf .vs-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.vault-shelf .vs-row .vs-lbl { margin-bottom: 0; }

/* ---- the infinite shelf --------------------------------------------------
 * design/0009 -- one continuous scroll, and the way to add a shelf is at both ends of it.
 */

.vault-shelf #vs-library {
  flex: 1 1 auto;
  overflow-y: auto;
  min-height: 0;
  padding: 6px 20px 40px;
}

.vault-shelf #vs-library > * {
  max-width: var(--measure);
  margin-left: auto;
  margin-right: auto;
}

.vault-shelf .vs-newshelf {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 14px 0 18px;
  padding: 9px 12px;
  color: var(--text-3);
  background: none;
  border: 1px dashed var(--border-strong);
  border-radius: 3px;
  min-height: 38px;
}

.vault-shelf .vs-newshelf:hover { color: var(--accent); border-color: var(--accent); background: var(--surface-1); }
.vault-shelf .vs-newshelf .vs-plus { font-size: 15px; line-height: 1; }

.vault-shelf .vs-activefilters {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--accent);
  border-radius: 3px;
  background: var(--surface-1);
  padding: 7px 10px;
  margin-bottom: 14px;
  font-size: 12px;
}

.vault-shelf .vs-shelf { margin-bottom: 26px; }

.vault-shelf .vs-shelfhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 5px;
  margin-bottom: 9px;
}

.vault-shelf .vs-shelfhead h2 {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-1);
  margin: 0;
}

.vault-shelf .vs-shelfhead .vs-meta { color: var(--text-3); font-size: 11.5px; }
.vault-shelf .vs-shelfhead .vs-mini { margin-left: auto; opacity: 0; transition: opacity 120ms ease; }
.vault-shelf .vs-shelf:hover .vs-shelfhead .vs-mini,
.vault-shelf .vs-shelfhead .vs-mini:focus-within { opacity: 1; }

/* design/0014 -- A BOOKCASE. The rail holds one or more boards, each one a full-width row of
 * books; a run too long for the room continues on the next one down. Nothing scrolls
 * sideways, which is the whole point: a horizontal scroller hides the far end of a shelf and
 * gives no clue how much of it there is. */
.vault-shelf .vs-shelfrail {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 6px;
  min-width: 0;
}

/* THE FLOOR IS INSIDE THE ROW, for the same reason the plaque is (design/0003): a rule drawn
 * outside would have to be kept in step with a row whose height depends on what is on it.
 *
 * IT IS A BACKGROUND, NOT A BORDER, and that is what lets the plaque hang BELOW it. As a
 * bottom border the floor was the last thing in the track, so a plaque could only ever sit
 * above it -- a year label resting on the books rather than screwed to the shelf edge. Drawn
 * as a background line the floor sits at a known height, because a spine's height is a
 * constant, and the plaque row lives underneath it.
 *
 * The board runs the FULL WIDTH of the room even where the books stop, because a shelf does
 * (design/0014). A half-empty last row with a board ending mid-air reads as a broken rule. */
.vault-shelf .vs-track {
  display: flex;
  align-items: flex-start;
  gap: 3px;
  min-height: calc(var(--spine-h) + 34px);
  width: 100%;
  min-width: 0;
  background-image: linear-gradient(var(--border-strong), var(--border-strong));
  background-repeat: no-repeat;
  background-size: 100% var(--board);
  background-position: 0 var(--spine-h);
}

.vault-shelf .vs-group { display: flex; flex-direction: column; align-self: flex-start; }
.vault-shelf .vs-group .vs-books {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: var(--spine-h);
}

/* Hanging under the shelf edge, the way an engraved plate is screwed to the front of a
 * library shelf rather than propped against the books. */
.vault-shelf .vs-plaque {
  align-self: stretch;
  text-align: center;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  color: var(--text-3);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 0 0 3px 3px;
  padding: 2px 6px;
  margin: calc(var(--board) + 9px) 0 0;
}

/* ---- a spine -------------------------------------------------------------
 * design/0005 -- THE BOARD IS THE COLOUR, and there is nothing else on the spine.
 *
 * The first design put a stacked bar of the book's folder mix across the head of every spine.
 * It is the least analog thing that was in the room -- a chart drawn on a book -- and on a
 * shelf where most books draw from the same few folders it is the same rainbow over and over,
 * which the eye cannot compare anyway. It is gone.
 *
 * What is left is a dyed board: the dominant folder's slot mixed into the surface, with a
 * light-to-dark fall down the spine. The exact mix is not lost -- it is in the hover peek in
 * words, which is where anything nobody should have to read a colour for belongs.
 */
.vault-shelf .vs-spine {
  width: var(--spine-w);
  height: var(--spine-h);
  flex: 0 0 auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 3px 15px;
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--text-1) 3%, transparent) 0 22%,
      transparent 55%,
      color-mix(in srgb, var(--text-1) 4%, transparent) 100%),
    color-mix(in srgb, var(--spine-tint, var(--n1)) var(--tint), var(--surface-2));
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 2px 2px 1px 1px;
  color: var(--text-2);
  cursor: pointer;
  transition: transform 120ms ease, border-color 120ms ease, opacity 160ms ease,
              margin 160ms ease, box-shadow 120ms ease;
}

.vault-shelf .vs-spine:hover,
.vault-shelf .vs-spine:focus-visible {
  transform: translateY(-5px);
  border-color: var(--spine-tint, var(--accent));
  color: var(--text-1);
  z-index: 2;
}

/* THE TITLE FILLS THE SPINE, and that is what makes it read as a book rather than a column.
 * rotate(180deg) makes it read bottom-to-top, the way a spine on a shelf does. */
.vault-shelf .vs-spine .vs-title {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-height: 100%;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-align: center;
}

.vault-shelf .vs-spine .vs-n {
  position: absolute;
  bottom: 4px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 9.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.vault-shelf .vs-spine[data-empty="1"] { opacity: 0.45; }

/* ---- magic 1: shelf wear -------------------------------------------------
 * design/0008 -- a book you open often looks handled. Four steps, and every one of them is
 * a thing that happens to a real book: the boards darken where a hand holds them, the head
 * and tail soften, and it never quite goes back flush with its neighbours.
 */
.vault-shelf .vs-spine[data-wear="1"] { border-radius: 3px 3px 1px 1px; }
/* Wear darkens where a hand holds the boards. It adds LUMINANCE, never more colour: a
 * well-read book is a handled book, not a more purple one. */
.vault-shelf .vs-spine[data-wear="2"] {
  border-radius: 4px 4px 2px 2px;
  transform: translateY(-1px);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--text-1) 8%, transparent) 0 16%, transparent 40%),
    linear-gradient(0deg, color-mix(in srgb, var(--text-1) 5%, transparent) 0 9%, transparent 24%),
    color-mix(in srgb, var(--spine-tint, var(--n1)) var(--tint), var(--surface-2));
}
.vault-shelf .vs-spine[data-wear="3"] {
  border-radius: 5px 5px 2px 2px;
  transform: translateY(-2px);
  border-color: var(--border-strong);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--text-1) 12%, transparent) 0 18%, transparent 44%),
    linear-gradient(0deg, color-mix(in srgb, var(--text-1) 9%, transparent) 0 12%, transparent 30%),
    color-mix(in srgb, var(--spine-tint, var(--n1)) var(--tint), var(--surface-2));
}
.vault-shelf .vs-spine[data-wear="2"]:hover,
.vault-shelf .vs-spine[data-wear="3"]:hover { transform: translateY(-5px); }

/* ---- magic 2: ribbons that hang -----------------------------------------
 * design/0008 -- a bookmarked note leaves a ribbon out of the book, visible from the shelf
 * without opening anything. It hangs BELOW the board, which is why the track has room under
 * it and why the ribbon is not clipped by the rail.
 */
.vault-shelf .vs-spine .vs-ribbon {
  position: absolute;
  left: 50%;
  bottom: -13px;
  width: 7px;
  height: 17px;
  margin-left: -3.5px;
  background: var(--g8);
  border-radius: 0 0 1px 1px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
  pointer-events: none;
}

.vault-shelf .vs-spine .vs-ribbon[data-many="1"] { width: 11px; margin-left: -5.5px; }

/* ---- magic 3: the shelf parts as you type -------------------------------
 * design/0008 -- a query does not empty the room. Matching books draw forward and gain air
 * on both sides; everything else thins to a ghost and stays exactly where it was, so the
 * shelf you were looking at is still the shelf you are looking at.
 */
.vault-shelf[data-query="1"] .vs-spine[data-match="0"] {
  opacity: 0.16;
  filter: saturate(0.2);
}

.vault-shelf[data-query="1"] .vs-spine[data-match="1"] {
  margin-left: 9px;
  margin-right: 9px;
  transform: translateY(-7px);
  border-color: var(--accent);
  box-shadow: 0 2px 0 0 var(--accent);
  color: var(--text-1);
  z-index: 1;
}

.vault-shelf[data-query="1"] .vs-spine[data-match="1"] .vs-n { color: var(--accent); font-weight: 600; }

.vault-shelf .vs-endcard {
  border: 1px dashed var(--border);
  border-radius: 3px;
  padding: 14px 18px;
  text-align: center;
  color: var(--text-3);
}

.vault-shelf .vs-endcard p { margin: 0 0 10px; }

/* ---- the reader ---------------------------------------------------------- */

.vault-shelf .vs-reader {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  background: var(--surface-0);
}

.vault-shelf .vs-readerbar {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
  padding: 8px 12px;
}

.vault-shelf .vs-readerbar .vs-inner { gap: 8px; flex-wrap: wrap; }

.vault-shelf .vs-readerbar .vs-spacer { flex: 1 1 auto; }
.vault-shelf .vs-readertitle { color: var(--text-2); font-size: 12px; }

.vault-shelf #vs-ribbon[aria-pressed="true"] {
  color: #fff;
  background: var(--g8);
  border-color: var(--g8);
}

/* min-width: 0 ON BOTH, and it takes both. A flex item and a grid item each default to
 * `min-width: auto`, which means "never shrink below your content" -- so a single long
 * paragraph in the note pushed the spread wider than the view and grew a horizontal
 * scrollbar across the whole reader. Fixing only the page left the spread doing it. */
/* design/0012 -- AN OPEN BOOK, NOT TWO PANES.
 *
 * The first spread was a split view with a divider: correct, and it read as an email client.
 * Four things make it a book, and none of them is a texture or a page-turn -- the animation
 * budget is still 5px of hover lift (design/0005):
 *
 *   the GUTTER   both inner edges darken toward the fold, so the two pages belong to one
 *                object rather than sitting side by side;
 *   the EDGES    a few hairlines down the outer edges: the stack of leaves you would see
 *                looking at a book from the front;
 *   the OBJECT   rounded outer corners and a shadow, so it lies ON the surface;
 *   the SETTING  the book's title and its contents are set in the reading face, because a
 *                book's index is printed in the same type as its text.

  --border-strong: #a98f68;
  --accent: #7a2018;
  background: linear-gradient(180deg, #f5ecd6, #e9dcc0);
  border: 1px solid #7a5730;
  border-radius: 3px;
  box-shadow: 0 0 0 7px #33210f, 0 0 0 8px var(--vs-gilt-dim), 0 24px 50px rgba(0, 0, 0, 0.6);
  color: var(--text-1);
}

.vault-shelf[data-look="leather"] .vs-sheetbody h2 {
  font-family: var(--prose);
  letter-spacing: 0.02em;
}

.vault-shelf[data-look="leather"] .vs-sheetbody button {
  color: #3b2a15;
  background: linear-gradient(180deg, #efe2c2, #d9c69c);
  border-color: #a98f68;
}

.vault-shelf[data-look="leather"] .vs-sheetbody button:hover {
  color: #241a10;
  border-color: #7a5730;
}

.vault-shelf[data-look="leather"] .vs-sheetbody button.vs-primary {
  color: #241a10;
  background: linear-gradient(180deg, var(--vs-gilt-hi), #c9a45e);
  border-color: #8a6a2a;
}

.vault-shelf[data-look="leather"] .vs-sheetbody input[type="search"],
.vault-shelf[data-look="leather"] .vs-sheetbody input[type="text"],
.vault-shelf[data-look="leather"] .vs-sheetbody select {
  color: #241a10;
  background: #fbf5e6;
  border-color: #b9a37d;
  box-shadow: inset 0 1px 2px rgba(90, 70, 40, 0.25);
}

.vault-shelf[data-look="leather"] .vs-endcard {
  border-color: #4d3620;
  color: #a8895e;
}

/* ---- the shelf -----------------------------------------------------------
 * design/0009 -- the floor is a BACKGROUND on the track, painted at a known height, which is
 * what lets a plaque hang below it. Wood builds on that rather than fighting it: the same
 * layer, thicker, with grain along it and a lit front edge.
 */
.vault-shelf[data-look="leather"] .vs-track {
  --board: 14px;
  background-image:
    /* the shadow the books cast on the board they stand on -- two pixels, not a bruise: the
     * first cut painted half the plank black and the wood disappeared */
    linear-gradient(180deg, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0)),
    /* the lit top of the plank, and the front edge turning under it */
    linear-gradient(180deg,
      rgba(255, 236, 195, 0.55) 0 1px,
      rgba(255, 226, 170, 0.16) 1px 3px,
      rgba(0, 0, 0, 0) 3px 62%,
      rgba(0, 0, 0, 0.22) 82%,
      rgba(0, 0, 0, 0.5) 100%),
    var(--vs-woodgrain),
    linear-gradient(180deg, #8a5c35 0 22%, #77502e 45%, #5c3a20 78%, var(--vs-wood-dark) 100%),
    /* and the shadow the board itself throws down the panelling behind it */
    linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));
  background-size:
    100% 4px,
    100% var(--board),
    300px var(--board),
    100% var(--board),
    100% 10px;
  background-position:
    0 var(--spine-h),
    0 var(--spine-h),
    0 var(--spine-h),
    0 var(--spine-h),
    0 calc(var(--spine-h) + var(--board));
  background-repeat: no-repeat, no-repeat, repeat-x, no-repeat, no-repeat;
  background-blend-mode: normal, normal, overlay, normal, normal;
}

/* The rail scrolls, and the platform's own scrollbar is a grey pill lying across the wood.
 * A brass runner instead, and only on the shelf rails -- nothing else here touches one. */
.vault-shelf[data-look="leather"] .vs-shelfrail {
  /* BOTH SPELLINGS, and the standard one is not belt and braces: a host that sets
   * `scrollbar-color` anywhere above us puts Chromium on the standard scrollbar, where every
   * ::-webkit-scrollbar rule below is ignored. In the standalone the brass runner drew and in
   * Obsidian it stayed grey, which is what that difference looks like. */
  scrollbar-color: #8a6a2a rgba(0, 0, 0, 0.35);
  scrollbar-width: thin;
}

.vault-shelf[data-look="leather"] .vs-shelfrail::-webkit-scrollbar { height: 8px; }

.vault-shelf[data-look="leather"] .vs-shelfrail::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.35);
  border-radius: 4px;
}

.vault-shelf[data-look="leather"] .vs-shelfrail::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #8a6a2a, #5a4119);
  border-radius: 4px;
}

.vault-shelf[data-look="leather"] .vs-shelfrail::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #c9a45e, #8a6a2a);
}

/* An engraved brass plate, screwed to the front of the shelf. */
.vault-shelf[data-look="leather"] .vs-plaque {
  color: #3a2a10;
  background: linear-gradient(180deg, #d9be7d 0 42%, #b2934c 42% 100%);
  border: 1px solid #7a5f26;
  border-top: 0;
  border-radius: 0 0 2px 2px;
  font-family: var(--prose);
  font-weight: 600;
  letter-spacing: 0.2em;
  text-shadow: 0 1px 0 rgba(255, 245, 210, 0.55);
  box-shadow: inset 0 -1px 0 rgba(255, 245, 210, 0.4), 0 2px 4px rgba(0, 0, 0, 0.45);
}

/* ---- a spine -------------------------------------------------------------
 * A bound volume, and every piece of it has to still read at 22px wide:
 *
 *   the DYE        the folder's slot, deepened -- a hide takes a colour, it does not print one
 *   the ROUND      a spine is a cylinder: light down the left edge, shadow down the right
 *   the GRAIN      fractal noise over the dye, so it is hide rather than paint
 *   the BANDS      the cords the leaves are sewn to, standing proud across the spine, with a
 *                  gilt fillet on the head side of each -- this is the one that says
 *                  "encyclopedia" from across a room
 *   the STAMPING   the title in gilt, in the reading face, because a binder had type and not
 *                  a UI font
 */
.vault-shelf[data-look="leather"] .vs-spine {
  background:
    linear-gradient(90deg,
      rgba(0, 0, 0, 0.45) 0 1px,
      rgba(255, 238, 205, 0.26) 1px 3px,
      rgba(255, 238, 205, 0.10) 3px 18%,
      rgba(0, 0, 0, 0) 42%,
      rgba(0, 0, 0, 0.26) 76%,
      rgba(0, 0, 0, 0.52) 100%),
    color-mix(in srgb, var(--spine-tint, var(--n1)) 90%, #170d06);
  border: 1px solid rgba(0, 0, 0, 0.55);
  border-top: 0;
  border-radius: 3px 3px 1px 1px;
  color: var(--vs-gilt);
  box-shadow:
    inset 0 -6px 10px rgba(0, 0, 0, 0.45),
    0 3px 6px rgba(0, 0, 0, 0.45);
  transform-origin: 50% 100%;
}

/* the raised bands, the gilt fillets and the grain, in one overlay */
.vault-shelf[data-look="leather"] .vs-spine::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background-image:
    /* head cap: the leather turned over the head of the boards */
    linear-gradient(180deg,
      rgba(255, 238, 205, 0.20) 0 1px,
      rgba(0, 0, 0, 0.30) 1px 3px,
      rgba(0, 0, 0, 0) 3px 6px,
      rgba(226, 200, 125, 0.50) 6px 7px,
      rgba(0, 0, 0, 0) 7px 100%),
    /* THE BANDS. Four cords across a 132px spine: a shadow where the leather falls away
     * above the cord, a proud lit face, and a deeper shadow under it. This is the piece that
     * has to survive at 22px wide, which is why it is drawn across the full width and never
     * inset. */
    repeating-linear-gradient(180deg,
      rgba(0, 0, 0, 0) 0 24px,
      rgba(0, 0, 0, 0.34) 24px 26px,
      rgba(255, 238, 205, 0.10) 26px 27px,
      rgba(255, 238, 205, 0.22) 27px 30px,
      rgba(255, 238, 205, 0.08) 30px 31px,
      rgba(0, 0, 0, 0.44) 31px 33px,
      rgba(0, 0, 0, 0.16) 33px 35px),
    /* a gilt hair tooled on the head side of each band */
    repeating-linear-gradient(180deg,
      rgba(0, 0, 0, 0) 0 22px,
      rgba(226, 200, 125, 0.40) 22px 23px,
      rgba(0, 0, 0, 0) 23px 35px),
    var(--vs-grain);
  background-size: 100% 100%, 100% 100%, 100% 100%, 140px 140px;
  background-blend-mode: normal, normal, normal, overlay;
}

/* the tail panel: a double gilt rule with the volume number under it */
.vault-shelf[data-look="leather"] .vs-spine::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 15px;
  height: 3px;
  pointer-events: none;
  background:
    linear-gradient(180deg,
      rgba(226, 200, 125, 0.5) 0 1px,
      rgba(0, 0, 0, 0) 1px 2px,
      rgba(226, 200, 125, 0.32) 2px 3px);
}

.vault-shelf[data-look="leather"] .vs-spine .vs-title {
  position: relative;
  z-index: 1;
  color: var(--vs-gilt);
  font-family: var(--prose);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.65), 0 0 5px rgba(230, 200, 125, 0.22);
}

.vault-shelf[data-look="leather"] .vs-spine .vs-n {
  position: absolute;
  z-index: 1;
  bottom: 3px;
  color: var(--vs-gilt-dim);
  font-family: var(--prose);
  font-size: 9px;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
}

/* A book tips out of the shelf before it comes off it. design/0005 keeps the budget at 5px of
 * lift; this spends one more pixel and two degrees, about the bottom edge, and still moves
 * nothing but a transform -- a tilted spine cannot reflow its neighbours. */
.vault-shelf[data-look="leather"] .vs-spine:hover,
.vault-shelf[data-look="leather"] .vs-spine:focus-visible {
  transform: translateY(-6px) rotate(-1.6deg);
  border-color: rgba(0, 0, 0, 0.7);
  color: var(--vs-gilt-hi);
  box-shadow:
    inset 0 -6px 10px rgba(0, 0, 0, 0.35),
    0 10px 18px rgba(0, 0, 0, 0.55);
}

.vault-shelf[data-look="leather"] .vs-spine:hover .vs-title,
.vault-shelf[data-look="leather"] .vs-spine:focus-visible .vs-title {
  color: var(--vs-gilt-hi);
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.65), 0 0 9px rgba(247, 235, 189, 0.4);
}

/* ---- wear, in leather ----------------------------------------------------
 * design/0008 -- a handled book is rubbed rather than repainted: the dye lightens at the head
 * and tail where a hand pulls it off the shelf, and the gilt goes dull before it goes.
 */
.vault-shelf[data-look="leather"] .vs-spine[data-wear="2"],
.vault-shelf[data-look="leather"] .vs-spine[data-wear="3"] {
  background:
    linear-gradient(180deg,
      rgba(255, 226, 175, 0.16) 0 10%,
      rgba(0, 0, 0, 0) 26% 74%,
      rgba(255, 226, 175, 0.12) 92% 100%),
    linear-gradient(90deg,
      rgba(255, 236, 200, 0.16) 0 1px,
      rgba(255, 236, 200, 0.07) 1px 3px,
      rgba(0, 0, 0, 0) 22%,
      rgba(0, 0, 0, 0.18) 62%,
      rgba(0, 0, 0, 0.42) 100%),
    color-mix(in srgb, var(--spine-tint, var(--n1)) 86%, #150c06);
}

.vault-shelf[data-look="leather"] .vs-spine[data-wear="3"] .vs-title {
  color: var(--vs-gilt-dim);
}

.vault-shelf[data-look="leather"] .vs-spine[data-wear="2"]:hover,
.vault-shelf[data-look="leather"] .vs-spine[data-wear="3"]:hover {
  transform: translateY(-6px) rotate(-1.6deg);
}

/* ---- the ribbon ----------------------------------------------------------
 * Silk rather than felt: a highlight down one side, and it hangs in front of the boards.
 */
.vault-shelf[data-look="leather"] .vs-spine .vs-ribbon {
  z-index: 2;
  background:
    linear-gradient(90deg,
      rgba(255, 255, 255, 0.30) 0 1px,
      rgba(0, 0, 0, 0) 1px 60%,
      rgba(0, 0, 0, 0.28) 100%),
    var(--g8);
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
}

/* ---- the query, in leather ----------------------------------------------
 * design/0008 -- the room still parts; what draws forward is lit rather than outlined, because
 * an accent border on a bound book reads as a sticker.
 */
.vault-shelf[data-look="leather"][data-query="1"] .vs-spine[data-match="1"] {
  border-color: rgba(0, 0, 0, 0.6);
  box-shadow:
    inset 0 -6px 10px rgba(0, 0, 0, 0.35),
    0 0 0 1px rgba(226, 200, 125, 0.55),
    0 10px 20px rgba(0, 0, 0, 0.55),
    0 0 22px rgba(226, 200, 125, 0.22);
}

.vault-shelf[data-look="leather"][data-query="1"] .vs-spine[data-match="1"] .vs-n {
  color: var(--vs-gilt-hi);
}

/* ---- the reader ----------------------------------------------------------
 * design/0012 -- the spread was already an open book made of geometry. Under leather it gets
 * the two things geometry could not give it: the inside of the cover, which is marbled
 * endpaper, and gilded edges on the leaves.
 */
.vault-shelf[data-look="leather"] .vs-reader {
  background:
    radial-gradient(120% 90% at 50% 0%,
      rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.74) 74%),
    var(--vs-marble);
  /* The tile is drawn at 260 and laid down at 168, because marbling is a fine thing: at
   * full size the veins read as camouflage rather than as paper. */
  background-size: auto, 168px 168px;
}

.vault-shelf[data-look="leather"] .vs-readerbar {
  background:
    var(--vs-woodgrain),
    linear-gradient(180deg, #3b2617, #22150c);
  background-size: 300px 100%, auto;
  background-blend-mode: overlay, normal;
  border-bottom: 1px solid var(--vs-gilt-dim);
}

.vault-shelf[data-look="leather"] .vs-readertitle {
  color: var(--vs-gilt);
  font-family: var(--prose);
  font-size: 12.5px;
  letter-spacing: 0.06em;
}

/* THE COVER IS A SHADOW, NOT A BORDER: a box-shadow ring frames the spread in leather and a
 * gilt fillet without adding a pixel to the grid, so the two pages keep the widths
 * design/0009 measured. Only the margin grows, to give the cover somewhere to sit. */
.vault-shelf[data-look="leather"] .vs-spread {
  margin: 26px auto 30px;
  border: 1px solid #1a0f07;
  border-radius: 2px;
  /* The cover, tooled with a double fillet: leather, a gilt rule, more leather, a fainter
   * gilt rule. Every ring is a shadow, so the boards cost the grid nothing. */
  box-shadow:
    0 0 0 7px #402916,
    0 0 0 8px var(--vs-gilt-dim),
    0 0 0 13px #402916,
    0 0 0 14px rgba(168, 134, 61, 0.55),
    0 0 0 15px #1a0f07,
    0 24px 50px rgba(0, 0, 0, 0.66);
}

/* gilded edges: the leaves seen from the fore-edge, gold-tooled */
.vault-shelf[data-look="leather"] .vs-spread::before,
.vault-shelf[data-look="leather"] .vs-spread::after {
  width: 6px;
  background:
    repeating-linear-gradient(90deg,
      rgba(120, 90, 30, 0.35) 0 1px,
      rgba(0, 0, 0, 0) 1px 2px),
    linear-gradient(90deg, #b8923b, #f0dfa6 45%, #a8863d);
}

/* THE PAPER TOKENS. Every rule inside a page -- headings, contents, leader dots, the note, its
 * meta line, blockquote rules -- reads the same three text steps and two surfaces. Redeclaring
 * them on `.vs-page` turns the whole inside of the book to ink-on-paper without restating a
 * single one of those rules, and it is also what keeps the gutter gradient dark: it mixes
 * `--text-1`, which in here is ink. */
.vault-shelf[data-look="leather"] .vs-page {
  --surface-1: #efe3c8;
  --surface-2: #f6eed9;
  --text-1: #241a10;
  --text-2: #4d3a26;
  --text-3: #806a4a;
  --border: #d3c1a0;
  --border-strong: #b09a72;
  --accent: #7a2018;
  color: var(--text-1);
}

/* Aged paper: warmer and duller toward the fore-edge, where a book is handled. The first cut
 * had two large foxing spots on each page and they photographed as thumbprints -- age is in
 * the fall of the colour across the sheet, not in stains somebody has to look at. */
.vault-shelf[data-look="leather"] .vs-page.vs-left {
  background:
    radial-gradient(120% 90% at 100% 50%, rgba(150, 110, 60, 0.05), rgba(0, 0, 0, 0) 60%),
    linear-gradient(90deg, #e8dabb 0%, #f1e6cd 34%, #efe3c8 100%);
}

.vault-shelf[data-look="leather"] .vs-page.vs-right {
  background:
    radial-gradient(120% 90% at 100% 50%, rgba(150, 110, 60, 0.07), rgba(0, 0, 0, 0) 62%),
    linear-gradient(90deg, #f6eed9 0%, #f4ead2 72%, #ebe0c2 100%);
}

/* The fold is deeper in a bound book than in two panes. */
.vault-shelf[data-look="leather"] .vs-page.vs-left::after {
  width: 30px;
  background: linear-gradient(90deg,
    rgba(0, 0, 0, 0) 0%,
    rgba(60, 36, 14, 0.10) 55%,
    rgba(45, 26, 10, 0.30) 100%);
}

.vault-shelf[data-look="leather"] .vs-page.vs-right::after {
  width: 30px;
  background: linear-gradient(90deg,
    rgba(45, 26, 10, 0.34) 0%,
    rgba(60, 36, 14, 0.10) 45%,
    rgba(0, 0, 0, 0) 100%);
}

.vault-shelf[data-look="leather"] .vs-page h2 {
  color: #2a1a0c;
  letter-spacing: 0.02em;
}

/* THE CONTENTS ROWS ARE NOT BUTTONS TO LOOK AT. They are `<button>` elements, so the leather
 * button rule above reached them and printed a row of little plaques down the index -- caught
 * in the first screenshot, invisible to every check in the suite. A printed index is ink on
 * the page and nothing else. */
.vault-shelf[data-look="leather"] .vs-contents button {
  color: var(--text-2);
  background: none;
  border: 0;
  /* AND THE HOST'S OWN BUTTON RULES, which only show inside Obsidian: app.css gives every
   * `button` a box-shadow and `justify-content: center`, so the index printed as a stack of
   * centred plaques in the app and as a proper left-aligned index in the standalone. Nothing
   * in the suite sees this -- the standalone is what it drives. The default look has the same
   * two symptoms and the fix belongs in page.css; it is not made here, because this file may
   * not reach into the other look. */
  box-shadow: none;
  justify-content: flex-start;
}

.vault-shelf[data-look="leather"] .vs-contents button:hover {
  color: #241a10;
  background: rgba(90, 60, 25, 0.10);
  border: 0;
}

.vault-shelf[data-look="leather"] .vs-contents button[aria-current="true"] {
  color: #5c1a12;
}

/* A book's headings are set in the book's type. page.css puts them in the UI face because the
 * default look lives in the host's chrome; on paper that is a sans-serif label pasted into a
 * printed page. */
.vault-shelf[data-look="leather"] .vs-prose h1,
.vault-shelf[data-look="leather"] .vs-prose h2,
.vault-shelf[data-look="leather"] .vs-prose h3,
.vault-shelf[data-look="leather"] .vs-notemeta strong {
  font-family: var(--prose);
  color: #2a1a0c;
}

.vault-shelf[data-look="leather"] .vs-alsoin button,
.vault-shelf[data-look="leather"] .vs-editin button {
  color: #4a3218;
  background: linear-gradient(180deg, #ede0be, #d8c69e);
  border: 1px solid #b09a72;
}

.vault-shelf[data-look="leather"] .vs-alsoin button:hover,
.vault-shelf[data-look="leather"] .vs-editin button:hover {
  color: #241a10;
  border-color: #7a5730;
}

.vault-shelf[data-look="leather"] #vs-within {
  color: #241a10;
  background: #fbf5e6;
  border-color: #bda880;
  box-shadow: inset 0 1px 2px rgba(90, 70, 40, 0.2);
}

.vault-shelf[data-look="leather"] .vs-prose {
  color: #241a10;
}

/* Index tabs cut from leather, stamped in gilt, protruding from the fore-edge. */
.vault-shelf[data-look="leather"] .vs-tabs button {
  color: var(--vs-gilt);
  background: linear-gradient(90deg, #3b2617, #2a1a0f);
  border: 1px solid #1a0f07;
  border-left: 0;
  border-radius: 0 3px 3px 0;
  font-family: var(--prose);
  box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.45);
}

.vault-shelf[data-look="leather"] .vs-tabs button[aria-current="true"] {
  color: #2a1a0c;
  background: linear-gradient(90deg, #c9a45e, var(--vs-gilt-hi));
  border-color: #6b4f1e;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}

.vault-shelf[data-look="leather"] #vs-ribbon[aria-pressed="true"] {
  color: #f7ecd6;
  background: var(--g8);
  border-color: #4a140f;
}

/* ---- plain list mode and reduced motion ---------------------------------
 * design/0005 -- the list view is the assistive-technology one: a row of text, not a spine
 * seen edge-on. Bands drawn across a 132px-tall spine become stripes across a 34px row, so
 * they go, and the dye stays.
 */
.vault-shelf[data-look="leather"][data-list="1"] .vs-spine::before {
  background-image: var(--vs-grain);
  background-size: 140px 140px;
  background-blend-mode: overlay;
}

.vault-shelf[data-look="leather"][data-list="1"] .vs-spine::after { display: none; }

.vault-shelf[data-look="leather"][data-list="1"] .vs-spine .vs-title {
  text-transform: none;
  letter-spacing: 0.04em;
}

@media (prefers-reduced-motion: reduce) {
  .vault-shelf[data-look="leather"] .vs-spine:hover,
  .vault-shelf[data-look="leather"] .vs-spine:focus-visible,
  .vault-shelf[data-look="leather"] .vs-spine[data-wear="2"]:hover,
  .vault-shelf[data-look="leather"] .vs-spine[data-wear="3"]:hover {
    transform: none;
  }
}

/* design/0016 -- THE CYBERPUNK LOOK.
 *
 * A third look, opt-in like the leather one and under the same rule: it may repaint anything
 * and move nothing. Every selector below is scoped to `.vault-shelf[data-look="cyber"]`, so
 * the default look and the leather one cannot see a line of it.
 *
 * This file is the starting palette only. The look itself is being built out; until then it
 * is a legible dark neon that already reads as a different room rather than a placeholder.
 */

.vault-shelf[data-look="cyber"] {
  --ink: #e9f6ff;
  --text-1: #e9f6ff;
  --text-2: #8fb6cc;
  --text-3: #5b7d92;
  --surface-0: #070b14;
  --surface-1: #0c1322;

<script>
/* ===================================================================== types ==
 * The three boundaries of this file, as JSDoc: what comes IN as data and options, and what
 * goes OUT as the __vs api. Comments only -- the exporter inlines this file as text and the
 * plugin bundles it as JavaScript; typescript-eslint reads these through tsconfig.json's
 * allowJs, and plugin/main.js imports them as `import("../src/page.js").X`. Typedefs live at
 * module scope for that reason: one declared inside mountVaultShelf would be local to it.
 */

/**
 * One note, as both producers emit it: src/build-shelf.mjs into the standalone file, and
 * plugin/main.js from Obsidian's metadata cache. src/core/types.ts declares the same shape
 * for the TypeScript side; these two must agree, and check-parity in the suite says so.
 * @typedef {Object} ShelfNote
 * @property {string} id        vault-relative path with "/" separators
 * @property {string} path
 * @property {string} title
 * @property {string} folder    first path segment, or "(vault root)"
 * @property {string|null} date ISO YYYY-MM-DD, or null for Undated
 * @property {string[]} people
 * @property {string[]} tags
 * @property {Record<string,string>} props
 * @property {string} excerpt
 * @property {string} body
 */

/**
 * @typedef {Object} ShelfData
 * @property {string} vault
 * @property {string} generated
 * @property {ShelfNote[]} notes
 * @property {{ path: string, count: number, slot: number }[]} folders
 * @property {{ notes: number, dated: number, people: number, tags: number }} stats
 */

/**
 * THE CORE IS TYPED AS EXACTLY THE MEMBERS THIS FILE CALLS and nothing more -- the module
 * under src/core, handed in rather than imported so the two hosts can bundle it their own
 * way. Anything a future caller needs that is not named here shows up on the no-unsafe
 * meter, which is the point.
 * @typedef {typeof import("./core/index")} ShelfCore
 */

/** @typedef {import("./core/index").Persisted} Persisted */
/** @typedef {import("./core/index").Shelf} Shelf */
/** @typedef {import("./core/index").Book} Book */
/** @typedef {import("./core/index").ShelfView} ShelfView */

/**
 * @typedef {Object} MountOptions
 * @property {ShelfCore} core            the src/core module namespace, from the host
 * @property {unknown} [settings]        persisted settings, migrated on the way in
 * @property {(next: Persisted) => void} [onSettings]
 * @property {(path: string) => void} [onOpenNote]  "Edit in Obsidian", host-supplied
 * @property {(into: HTMLElement, note: ShelfNote) => (void | Promise<void>)} [renderNote]
 *   design/0010 -- the host's own markdown renderer. Inside Obsidian this is
 *   MarkdownRenderer.render over the file's real text, so a note in the reading spread is
 *   the note: wikilinks, embeds, callouts, tasks, code. Absent, the page falls back to its
 *   own small renderer over whatever `body` the producer supplied.
 */

/* ================================================================== palette ==
 * design/0005 -- the twelve slots are VAULT GRAPH'S, and they are read out of the stylesheet
 * rather than written down here, because a copy of a palette is a palette that drifts. The
 * names are --g1..--g12 in src/page.css, which are that project's values verbatim; readTheme()
 * snapshots whatever the cascade currently resolves them to, so a theme switch re-reads them
 * instead of repainting from a stale array.
 */
var SLOT_KEYS = ["--g1", "--g2", "--g3", "--g4", "--g5", "--g6",

/* design/0011 -- A BOOK'S THICKNESS IS ITS NOTE COUNT, on a log scale between these two.
 * Linear would give the Encyclopedia's 0-9 volume (184 notes on the demo vault) a spine
 * fourteen times the width of a one-note book, which is not a shelf, it is a bar chart lying
 * down. Log compresses the tail so a big book is visibly big and a small one is still a book
 * you can read the title of. */
/* design/0014 -- the packing in rowsOf() and the `gap` on .vs-books are the same number, and
 * a row is mispacked by exactly their difference. */
/* design/0003 -- the classifiers that group under a bigger date: months and weeks under a
 * year, years under a decade. core.plaqueFor is the other half and the two agree by test. */
var PLAQUABLE = { month: true, week: true, year: true };

var SPINE_GAP = 3;
var SPINE_MIN = 22;
var SPINE_MAX = 58;

var ID = "vs-";

   * @param {string[][]} lists
