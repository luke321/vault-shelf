<div id="vs-app" class="vault-shelf">
  <header id="vs-rail">
    <div class="vs-inner">
      <span id="vs-vname" class="vs-railname">Vault Shelf</span>
      <nav id="vs-jump" aria-label="Jump to a shelf"></nav>
      <label class="vs-sr" for="vs-q">Search the library</label>
      <input type="search" id="vs-q" placeholder="Search the library...">
      <span id="vs-hits" role="status"></span>
      <button id="vs-order" aria-pressed="false">Oldest first</button>
      <button id="vs-manageopen">Manage</button>
    </div>
  </header>

  <main id="vs-library" tabindex="-1">
    <div id="vs-activefilters" class="vs-activefilters" hidden>
      <span id="vs-filtertext"></span>
      <button id="vs-clearfilters">Clear</button>
    </div>

    <button id="vs-newshelf" class="vs-newshelf">
      <span class="vs-plus" aria-hidden="true">&plus;</span>
      <span>New shelf</span>
    </button>

    <div id="vs-shelves"></div>

    <div id="vs-endcard" class="vs-endcard" hidden>
      <p id="vs-endtext"></p>
    </div>

    <button id="vs-newshelf2" class="vs-newshelf">
      <span class="vs-plus" aria-hidden="true">&plus;</span>
      <span>New shelf</span>
    </button>
  </main>

  <section id="vs-reader" class="vs-reader" hidden aria-label="Reading a book" tabindex="-1">
    <header class="vs-readerbar">
      <div class="vs-inner">
        <button id="vs-back">Back to shelves</button>
        <button id="vs-prevcollection" title="Previous collection (Alt+Left)">Previous collection</button>
        <span id="vs-readertitle" class="vs-readertitle"></span>
        <span class="vs-spacer"></span>
        <button id="vs-prevnote" title="Previous note">Previous</button>
        <button id="vs-nextnote" title="Next note">Next</button>
        <button id="vs-ribbon" class="vs-ribbon" aria-pressed="false" title="Leave a ribbon in this book">Ribbon</button>
      </div>
    </header>
    <div class="vs-spread">
      <div class="vs-page vs-left">
        <h2 id="vs-bookname"></h2>
        <p id="vs-bookmeta" class="vs-hint"></p>
        <label class="vs-sr" for="vs-within">Find within this book</label>
        <input type="search" id="vs-within" placeholder="Find within this book...">
        <ol id="vs-contents" class="vs-contents"></ol>
      </div>
      <div class="vs-page vs-right">
        <p id="vs-notemeta" class="vs-notemeta"></p>
        <article id="vs-note" class="vs-prose"></article>
        <div id="vs-alsoin" class="vs-alsoin"></div>
      </div>
      <nav id="vs-tabs" class="vs-tabs" aria-label="Index"></nav>
    </div>
  </section>

  <div id="vs-builder" class="vs-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="vs-buildertitle">
    <div class="vs-sheetbody">
      <h2 id="vs-buildertitle">New shelf</h2>

      <div class="vs-field">
        <label for="vs-bname">Name</label>
        <input type="text" id="vs-bname" value="New shelf">
      </div>

      <fieldset class="vs-field">
        <legend>Which notes belong here?</legend>
        <select id="vs-bsource">
          <option value="all">The whole vault</option>
          <option value="tag">Notes with a tag</option>
          <option value="person">Notes about a person</option>
          <option value="folder">Notes in a folder</option>
        </select>
        <select id="vs-bsourceval" aria-label="Which tag, person or folder" hidden></select>
      </fieldset>

      <fieldset class="vs-field">
        <legend>What makes a book?</legend>
        <select id="vs-bclassifier">
          <option value="initial">Title initial</option>
          <option value="year">Year</option>
          <option value="month">Month</option>
          <option value="week">ISO week</option>
          <option value="person">Person</option>
          <option value="tag">Tag</option>
          <option value="folder">Folder</option>
          <option value="property">A note property</option>
        </select>
        <select id="vs-bproperty" aria-label="Which note property" hidden></select>
      </fieldset>

      <div class="vs-field vs-row">
        <label><input type="checkbox" id="vs-bplaques"> Year plaques</label>
        <label><input type="checkbox" id="vs-bsubtags" checked> Parent tags include their children</label>
        <label><span>Order</span>
          <select id="vs-bdirection">
            <option value="alphabetical">Oldest first</option>
            <option value="chronological">Newest first</option>
          </select>
        </label>
      </div>

      <div class="vs-field">
        <div class="vs-lbl">Recipes</div>
        <div id="vs-recipes" class="vs-mini vs-wide"></div>
      </div>

      <div class="vs-preview">
        <div class="vs-lbl">Preview <span id="vs-previewcount" class="vs-val"></span></div>
        <div id="vs-preview" class="vs-shelfrail" aria-live="polite"></div>
      </div>

      <div class="vs-mini vs-wide vs-sheetactions">
        <button id="vs-bsave" class="vs-primary">Save shelf</button>
        <button id="vs-bcancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="vs-manage" class="vs-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="vs-managetitle">
    <div class="vs-sheetbody">
      <h2 id="vs-managetitle">Manage shelves</h2>
      <p class="vs-hint">Hiding a shelf never deletes it. Reorder with the arrows; the order here
        is the order of the library.</p>
      <div id="vs-managelist"></div>
      <div class="vs-mini vs-wide vs-sheetactions">
        <button id="vs-mnew">New shelf&hellip;</button>
        <button id="vs-mrestore">Show every shelf</button>
        <button id="vs-mclose" class="vs-primary">Done</button>
      </div>
    </div>
  </div>
</div>
