# main only ever receives develop, except an urgent patch may come from hotfix/*.
#
# WHY A WORKFLOW AND NOT A BRANCH PROTECTION SETTING: GitHub can require a pull request,
# require a review, require a status check and forbid a force push -- but it has no rule
# for "the pull request must come FROM this branch". So the rule is a check, and a ruleset on
# main requires this check to pass. Together they mean a pull request from any other branch
# cannot be merged, except the explicit hotfix/* lane.
#
# THE RULESET IS NOT ARMED YET, and this check therefore reports rather than blocks: GitHub
# does not offer rulesets on a private repository outside a paid plan. CONTRIBUTING.md says so
# and says what to add when the repository goes public. The other two directions -- the
# pre-push hook on `git push`, release.yml's ancestry guard on the tag -- are unaffected.
#
# THE MERGE INTO MAIN HAPPENS HERE, ON THE WEBSITE, and that is why scripts/release.ps1 does
# not push main: it pushes the tag alone, and refuses a main that is not exactly origin/main
# (the sister repo's release script wrote a tag and then met GH013 doing otherwise).
#
# The point is not ceremony. It is that main is what the Obsidian directory installs from, so
# anything reaching it should already have gone through develop -- where the invariant suite
# runs on every push, and where an issue is closed (close-issues.yml) -- unless it is an
# urgent patch release on a hotfix/* branch.
#
# The mirror of this for the command line is in .githooks/pre-push, which refuses a push to
# main that develop is not already an ancestor of. Neither is a substitute for the other:
# this one governs the button on the website, that one governs `git push`.

name: branch policy

on:
  pull_request:
    branches: [main]
    # Re-run when the PR is retargeted or its head moves, so an edited PR cannot keep a
    # green check it earned under a different base.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  source-branch:
    name: main accepts develop or hotfix
    runs-on: ubuntu-latest
    steps:
      - name: The head branch must be develop or hotfix/*
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # A fork's branch can also be called develop, so the repository is checked too --
          # otherwise the rule is satisfied by anyone who names a branch correctly.
          case "$HEAD_REF" in
            develop|hotfix/*) allowed=1 ;;
            *) allowed= ;;
          esac
          if [ -n "$allowed" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "head is $HEAD_REPO:$HEAD_REF -- allowed"
            exit 0
          fi
          echo "::error::main only accepts pull requests from develop or hotfix/* in this repository."
          echo "This pull request is from $HEAD_REPO:$HEAD_REF."
          echo ""
          echo "Merge ordinary work into develop first, then open develop -> main."
          echo "Use hotfix/* only for urgent patch releases."
          exit 1
